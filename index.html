  /* entradas */
  [data-fx]{opacity:0}

  .brasao.play .ld{opacity:1;transform:none;transition-delay:1.05s}
  .brasao.estatico [mask]{mask:none}

  .cg.vis{opacity:1;transform:none}
  .contagem h2{font-family:"Cinzel Decorative",serif;font-weight:400;font-size:calc(var(--u)*76);line-height:1;letter-spacing:.04em;color:var(--verde-txt);margin-bottom:calc(var(--u)*30)}

  @keyframes foilLinha{0%{background-position:100% 0}40%,100%{background-position:0% 0}}

  .filete.fino{margin-top:calc(var(--u)*8)}
  .cg.abre{transform:scaleX(0);transition:opacity .6s ease,transform 1.4s cubic-bezier(.5,0,.2,1)}
  .cg.abre.vis{transform:scaleX(1)}
  .relogio{display:flex;justify-content:center;align-items:stretch;margin:calc(var(--u)*30) 0}
  .unidade{width:calc(var(--u)*205);text-align:center}
  .unidade b{display:block;font-family:"Cinzel",serif;font-weight:400;font-size:calc(var(--u)*122);line-height:1;color:var(--verde-txt);font-variant-numeric:lining-nums tabular-nums}

  .unidade small{display:block;margin-top:calc(var(--u)*16);font-family:"Cinzel",serif;font-size:calc(var(--u)*24);letter-spacing:.22em;text-transform:uppercase;color:var(--ouro-esc)}
  .sep{display:block;width:calc(var(--u)*3);max-width:2px;min-width:1px;transform:scaleY(0);transition:transform 1.2s cubic-bezier(.5,0,.2,1) .5s}
  .relogio.vis .sep{transform:scaleY(1)}

<script>
(function(){
  var arte=document.getElementById('arte'), brasao=document.getElementById('brasao');
  var semMov=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function escala(){ document.documentElement.style.setProperty('--u',(arte.clientWidth/1080)+'px'); }
  escala(); window.addEventListener('resize',escala);

  /* atraso do brilho foil em cascata, pela altura */
  document.querySelectorAll('.brilho').forEach(function(b){
    var t=parseFloat(b.parentNode.style.top)||0; b.style.setProperty('--fd',(1.2+t*0.05).toFixed(2)+'s');
  });

  /* brasão */
  var inicio=Date.now()+99999, smil=!!(brasao&&document.getElementById('ini')&&document.getElementById('ini').beginElement);
  function tocarBrasao(){
    inicio=Date.now();
    if(!smil||semMov){ brasao.classList.add('estatico','play'); inicio=Date.now()-3000; return; }
    document.getElementById('ini').beginElement();
    brasao.classList.add('play');
    var logo=brasao.parentNode;
    setTimeout(function(){ logo.classList.add('luz'); document.getElementById('foilAnim').beginElement(); },2500);
    setInterval(function(){ try{ document.getElementById('foilAnim').beginElement(); }catch(e){} },7000);
  }

  /* entradas */
  function revela(el){
    var d=+(el.dataset.d||0);
    var portao=Math.max(0,inicio+1300-Date.now());   // nada aparece antes do brasão
    setTimeout(function(){ el.classList.add('vis'); },(semMov?0:portao+d));
  }
  function iniciaEntradas(){
    var alvos=document.querySelectorAll('[data-fx],.cg');
    if(!('IntersectionObserver' in window)){ alvos.forEach(revela); return; }
    var obs=new IntersectionObserver(function(es){ es.forEach(function(e){
      if(!e.isIntersecting) return; revela(e.target); obs.unobserve(e.target);
    }); },{threshold:0.15,rootMargin:'0px 0px -6% 0px'});
    alvos.forEach(function(a){ obs.observe(a); });
  }

  var primeira=arte.querySelector('.fundo img');
  function comecar(){
    arte.classList.add('pronta');
    setTimeout(function(){ tocarBrasao(); iniciaEntradas(); },150);
  }
  if(primeira.complete) comecar(); else { primeira.addEventListener('load',comecar); primeira.addEventListener('error',comecar); }

  /* confirmação (link ainda não definido) */
  var rsvp=document.getElementById('rsvp');
  if(rsvp) rsvp.addEventListener('click',function(e){ e.preventDefault(); });

  /* contagem */
  var alvo=new Date('2027-01-29T21:00:00-03:00').getTime();
  var dois=function(n){ return (n<10?'0':'')+n; };
  function poe(id,v){ var e=document.getElementById(id); v=String(v); if(e.textContent===v) return;
    var antes=e.textContent; e.textContent=v; if(antes!=='--'){ e.classList.remove('troca'); void e.offsetWidth; e.classList.add('troca'); } }
  (function atualiza(){
    var r=alvo-Date.now();
    if(r<=0){ document.getElementById('relogio').style.display='none'; document.getElementById('chegou').style.display='block'; return; }
    var s=Math.floor(r/1000);
    poe('d',Math.floor(s/86400)); poe('h',dois(Math.floor(s%86400/3600))); poe('m',dois(Math.floor(s%3600/60))); poe('s',dois(s%60));
    setTimeout(atualiza,1000);
  })();
})();
</script>
</body>
</html>
